name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.x
      - run: bun test

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: scan
        uses: ./
        with:
          path: fixtures
          changelog-file: ""
      - name: Assert every registry type was resolved
        env:
          COUNT: ${{ steps.scan.outputs.updates-count }}
          UPDATES: ${{ steps.scan.outputs.updates }}
        run: |
          echo "updates-count=$COUNT"
          test "$COUNT" -gt 0
          echo "$UPDATES" | jq -e 'map(.chart) as $c | ["reloader","external-dns","redis","podinfo","aws-node-termination-handler"] - $c | length == 0'
