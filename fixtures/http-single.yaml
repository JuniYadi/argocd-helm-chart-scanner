apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: default
  source:
    chart: reloader
    repoURL: https://stakater.github.io/stakater-charts
    targetRevision: 1.0.5 # pinned on purpose: fixture must stay outdated
  destination:
    server: https://kubernetes.default.svc
    namespace: reloader
